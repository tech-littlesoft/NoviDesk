<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="800" height="360" fill="#f7fafc"/>
  <text x="400" y="40" font-size="16" fill="#2d3748" font-weight="700" text-anchor="middle">深 / 浅主题 · 一键切换并记忆</text>
  <!-- dark panel -->
  <rect x="120" y="70" width="240" height="220" rx="14" fill="#1a202c" stroke="#2d3748" stroke-width="1.5"/>
  <circle cx="152" cy="100" r="9" fill="#f6e05e"/>
  <rect x="180" y="94" width="120" height="12" rx="6" fill="#4a5568"/>
  <rect x="140" y="130" width="200" height="50" rx="8" fill="#2d3748"/>
  <rect x="140" y="194" width="200" height="50" rx="8" fill="#2d3748"/>
  <text x="240" y="312" font-size="14" fill="#4a5568" text-anchor="middle" font-weight="700">深色 Dark</text>
  <!-- light panel -->
  <rect x="440" y="70" width="240" height="220" rx="14" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
  <circle cx="472" cy="100" r="9" fill="#f6ad55"/>
  <rect x="500" y="94" width="120" height="12" rx="6" fill="#2d3748"/>
  <rect x="460" y="130" width="200" height="50" rx="8" fill="#edf2f7"/>
  <rect x="460" y="194" width="200" height="50" rx="8" fill="#edf2f7"/>
  <text x="560" y="312" font-size="14" fill="#2d3748" text-anchor="middle" font-weight="700">浅色 Light</text>
  <!-- arrow between -->
  <text x="400" y="186" font-size="26" fill="#2b6cb0" text-anchor="middle" font-weight="700">⇄</text>
</svg>
