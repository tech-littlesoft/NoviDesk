<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="-apple-system,Segoe UI,Microsoft YaHei,sans-serif">
  <rect width="800" height="360" fill="#f7fafc"/>

  <!-- 5 个时间桶 -->
  <g font-size="13" text-anchor="middle" fill="#4a5568">
    <!-- 今天 -->
    <g>
      <rect x="40" y="80" width="132" height="240" rx="12" fill="#ffffff" stroke="#2b6cb0" stroke-width="2"/>
      <rect x="40" y="80" width="132" height="32" rx="12" fill="#ebf4ff"/>
      <text x="106" y="101" fill="#2b6cb0" font-weight="700">今天</text>
    </g>
    <!-- 昨天 -->
    <g>
      <rect x="188" y="80" width="132" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="188" y="80" width="132" height="32" rx="12" fill="#edf2f7"/>
      <text x="254" y="101">昨天</text>
    </g>
    <!-- 前天 -->
    <g>
      <rect x="336" y="80" width="132" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="336" y="80" width="132" height="32" rx="12" fill="#edf2f7"/>
      <text x="402" y="101">前天</text>
    </g>
    <!-- 近七天 -->
    <g>
      <rect x="484" y="80" width="132" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="484" y="80" width="132" height="32" rx="12" fill="#edf2f7"/>
      <text x="550" y="101">近七天</text>
    </g>
    <!-- 早些时候 -->
    <g>
      <rect x="632" y="80" width="132" height="240" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
      <rect x="632" y="80" width="132" height="32" rx="12" fill="#edf2f7"/>
      <text x="698" y="101">早些时候</text>
    </g>
  </g>

  <!-- 从上方落下并自动归集的文件（错峰） -->
  <g>
    <!-- 落进「今天」 -->
    <g>
      <rect width="96" height="20" rx="4" fill="#2b6cb0" opacity="0.9"/>
      <rect x="6" y="7" width="8" height="6" rx="1.5" fill="#fff" opacity="0.85"/>
      <rect x="20" y="7" width="60" height="6" rx="3" fill="#fff" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate"
        values="58,-30; 58,128; 58,128" keyTimes="0; 0.22; 1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.95;0.95;0.95" keyTimes="0;0.22;0.9;1" dur="5s" repeatCount="indefinite"/>
    </g>
    <!-- 落进「昨天」 -->
    <g>
      <rect width="96" height="20" rx="4" fill="#2b6cb0" opacity="0.75"/>
      <rect x="6" y="7" width="8" height="6" rx="1.5" fill="#fff" opacity="0.85"/>
      <rect x="20" y="7" width="60" height="6" rx="3" fill="#fff" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate"
        values="206,-30; 206,158; 206,158" keyTimes="0; 0.38; 1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0.8;0.8" keyTimes="0;0.38;0.9;1" dur="5s" repeatCount="indefinite"/>
    </g>
    <!-- 落进「前天」 -->
    <g>
      <rect width="96" height="20" rx="4" fill="#2b6cb0" opacity="0.6"/>
      <rect x="6" y="7" width="8" height="6" rx="1.5" fill="#fff" opacity="0.85"/>
      <rect x="20" y="7" width="60" height="6" rx="3" fill="#fff" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate"
        values="354,-30; 354,188; 354,188" keyTimes="0; 0.54; 1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.65;0.65;0.65" keyTimes="0;0.54;0.9;1" dur="5s" repeatCount="indefinite"/>
    </g>
    <!-- 落进「近七天」 -->
    <g>
      <rect width="96" height="20" rx="4" fill="#2b6cb0" opacity="0.45"/>
      <rect x="6" y="7" width="8" height="6" rx="1.5" fill="#fff" opacity="0.85"/>
      <rect x="20" y="7" width="60" height="6" rx="3" fill="#fff" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate"
        values="502,-30; 502,218; 502,218" keyTimes="0; 0.7; 1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.5;0.5;0.5" keyTimes="0;0.7;0.9;1" dur="5s" repeatCount="indefinite"/>
    </g>
    <!-- 落进「早些时候」 -->
    <g>
      <rect width="96" height="20" rx="4" fill="#718096" opacity="0.4"/>
      <rect x="6" y="7" width="8" height="6" rx="1.5" fill="#fff" opacity="0.85"/>
      <rect x="20" y="7" width="60" height="6" rx="3" fill="#fff" opacity="0.55"/>
      <animateTransform attributeName="transform" type="translate"
        values="650,-30; 650,248; 650,248" keyTimes="0; 0.86; 1" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.45;0.45;0.45" keyTimes="0;0.86;0.9;1" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- 已归档的静态文件（给桶底一点内容） -->
  <g fill="#e2e8f0">
    <rect x="58" y="158" width="96" height="18" rx="4"/>
    <rect x="206" y="188" width="96" height="18" rx="4"/>
    <rect x="354" y="218" width="96" height="18" rx="4"/>
    <rect x="502" y="248" width="96" height="18" rx="4"/>
    <rect x="650" y="278" width="96" height="18" rx="4"/>
  </g>

  <!-- 顶部说明 -->
  <text x="400" y="46" font-size="15" fill="#2d3748" text-anchor="middle" font-weight="600">新文件按时间自动归集 · 实时刷新</text>
</svg>