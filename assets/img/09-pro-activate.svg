<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 400" role="img" aria-label="激活码使用流程示意图">
  <defs>
    <style>
      .dlg-bg{fill:#ffffff;stroke:#cbd5e0;stroke-width:1.5}
      .dlg-title{fill:#1a1a1a}
      .dlg-text{fill:#2d3748;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
      .dlg-muted{fill:#718096;font-family:-apple-system,"Segoe UI","Microsoft YaHei",Roboto,sans-serif}
      .dlg-soft{fill:#edf2f7}
      .dlg-line{stroke:#e2e8f0;stroke-width:1}
      .btn-outline{fill:#ffffff;stroke:#cbd5e0;stroke-width:1}
      .pill-num{fill:#7c5cff}
      .pill-num-text{fill:#ffffff;font-family:-apple-system,"Segoe UI",sans-serif;font-weight:700}
      .callout-line{stroke:#7c5cff;stroke-width:2;stroke-dasharray:5 4;fill:none}
      @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}
      @keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
      .pulse{transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-in-out infinite}
      .pulse-2{animation-delay:1.2s}
      .cursor{animation:blink 1.05s steps(2) infinite}
    </style>
  </defs>

  <!-- dialog window -->
  <rect x="20" y="20" width="540" height="360" rx="10" class="dlg-bg"/>

  <!-- title bar -->
  <path d="M20 30 Q20 20 30 20 H550 Q560 20 560 30 V58 H20 Z" class="dlg-title"/>
  <text x="290" y="44" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600" font-family="-apple-system,Segoe UI,sans-serif">升级 Pro</text>

  <!-- status row -->
  <text x="40" y="88" font-size="13" class="dlg-muted">目前版本：</text>
  <text x="120" y="88" font-size="13" class="dlg-text" font-weight="700">基础版（试用中）</text>

  <!-- device id row -->
  <text x="40" y="132" font-size="13" class="dlg-muted">本设备 ID：</text>
  <rect x="128" y="112" width="240" height="32" rx="4" class="dlg-soft" stroke="#cbd5e0"/>
  <text x="140" y="133" font-size="13" class="dlg-text" font-family="Consolas,Menlo,monospace">FDESK-7608-E90A-2C31</text>
  <rect x="380" y="112" width="60" height="32" rx="4" class="btn-outline"/>
  <text x="410" y="133" font-size="13" class="dlg-text" text-anchor="middle">复制</text>

  <!-- divider -->
  <line x1="40" y1="172" x2="540" y2="172" class="dlg-line"/>

  <!-- activation code label -->
  <text x="40" y="208" font-size="13" class="dlg-muted">输入激活码：</text>

  <!-- textarea -->
  <rect x="40" y="222" width="500" height="80" rx="6" class="dlg-bg"/>
  <text x="56" y="262" font-size="13" fill="#a0aec0" font-family="-apple-system,Segoe UI,sans-serif">把激活码粘贴到此处</text>
  <!-- blinking cursor -->
  <line x1="56" y1="252" x2="56" y2="278" stroke="#2d3748" stroke-width="1.5" class="cursor"/>

  <!-- format hint -->
  <text x="40" y="324" font-size="11" class="dlg-muted">格式示例：7PG2-J7H8-DHQ5-XW40-3AC7-RKEC-V526-…</text>

  <!-- close button bottom-right -->
  <rect x="456" y="346" width="84" height="28" rx="4" class="btn-outline"/>
  <text x="498" y="364" font-size="13" class="dlg-text" text-anchor="middle">关闭</text>

  <!-- ============ Callouts (right column) ============ -->

  <!-- callout 1: 复制本设备 ID -->
  <g>
    <line x1="586" y1="128" x2="620" y2="128" class="callout-line"/>
    <circle cx="640" cy="128" r="18" class="pill-num pulse"/>
    <text x="640" y="134" font-size="15" class="pill-num-text" text-anchor="middle">1</text>
    <text x="666" y="120" font-size="13" class="dlg-text" font-weight="600">复制本设备 ID</text>
    <text x="666" y="138" font-size="11" class="dlg-muted">点 [复制] 拷出设备 ID</text>
    <text x="666" y="154" font-size="11" class="dlg-muted">下订单时填到备注</text>
  </g>

  <!-- callout 2: 粘贴激活码 -->
  <g>
    <line x1="546" y1="262" x2="620" y2="262" class="callout-line"/>
    <circle cx="640" cy="262" r="18" class="pill-num pulse pulse-2"/>
    <text x="640" y="268" font-size="15" class="pill-num-text" text-anchor="middle">2</text>
    <text x="666" y="254" font-size="13" class="dlg-text" font-weight="600">粘贴激活码</text>
    <text x="666" y="272" font-size="11" class="dlg-muted">把激活码粘到输入框</text>
    <text x="666" y="288" font-size="11" class="dlg-muted">自动验证，立即解锁 Pro</text>
  </g>
</svg>