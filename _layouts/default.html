<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="{{ site.baseurl }}/">
  <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/favicon.svg' | relative_url }}" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="NoviDesk 主页">
      <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true">
        <rect x="1"  y="1"  width="10" height="10" rx="3" fill="#ff5d5d"/>
        <rect x="13" y="1"  width="10" height="10" rx="3" fill="#5dadff"/>
        <rect x="25" y="1"  width="10" height="10" rx="3" fill="#ffd24a"/>
        <rect x="1"  y="13" width="10" height="10" rx="3" fill="#57d68d"/>
        <rect x="13" y="13" width="10" height="10" rx="3" fill="#b88bff"/>
        <rect x="25" y="13" width="10" height="10" rx="3" fill="#ffd24a"/>
        <rect x="1"  y="25" width="34" height="10" rx="5" fill="#e2e8f0"/>
      </svg>
      <span class="brand-text">
        <span class="brand-name">NoviDesk</span>
        <span class="brand-sub">悬浮桌面 · 小维桌面 · 工作站</span>
      </span>
    </a>
    <a class="topbar-cta" href="{{ '/buy/' | relative_url }}">获取 Pro</a>
  </header>

  <div class="layout{% if page.toc %} has-toc{% endif %}">
    <aside class="sidebar" aria-label="文档导航">
      {% include sidebar.html %}
    </aside>

    <main class="page">
      {{ content }}
    </main>

    {% if page.toc %}
    <aside class="toc" aria-label="本页目录">
      <div class="toc-inner">
        <div class="toc-title">本页目录</div>
        <nav id="toc"></nav>
      </div>
    </aside>
    {% endif %}
  </div>

  <footer class="site-footer">
    <p>© {{ site.time | date: '%Y' }} NoviDesk · 悬浮桌面 / 小维桌面</p>
  </footer>

{% if page.toc %}
  <script>
  (function () {
    var page = document.querySelector('.page');
    var toc = document.getElementById('toc');
    if (!page || !toc) return;

    var heads = page.querySelectorAll('h2, h3');
    if (!heads.length) {
      var box = toc.closest('.toc');
      if (box) box.style.display = 'none';
      return;
    }

    var list = document.createElement('ul'), nodes = [];
    Array.prototype.forEach.call(heads, function (h, i) {
      if (!h.id) {
        var s = (h.textContent || '').trim().toLowerCase()
          .replace(/[^\w\u4e00-\u9fa5]+/g, '-').replace(/^-+|-+$/g, '');
        h.id = s || ('sec-' + (i + 1));
      }
      var li = document.createElement('li');
      li.className = 'toc-' + h.tagName.toLowerCase();

      var a = document.createElement('a');
      a.setAttribute('href', location.pathname + '#' + h.id);

      var en = h.querySelector('span.en');
      a.textContent = (h.textContent || '').replace(en ? en.textContent : '', '').replace(/\s+/g, ' ').trim();

      li.appendChild(a);
      list.appendChild(li);
      nodes.push(h);
    });
    toc.appendChild(list);

    var links = toc.querySelectorAll('a');
    if (!('IntersectionObserver' in window)) return;
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return;
        var idx = nodes.indexOf(e.target);
        Array.prototype.forEach.call(links, function (l, j) {
          l.className = (j === idx) ? 'active' : '';
        });
      });
    }, { rootMargin: '-84px 0px -72% 0px' });
    nodes.forEach(function (h) { io.observe(h); });
  })();
  </script>
{% endif %}
</body>
</html>
